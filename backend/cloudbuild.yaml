steps:
  # 1. Dockerイメージのビルド
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/typing-app', '.']

  # 2. イメージをプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/typing-app']

  # 3. Cloud Runへのデプロイ
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'typing-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/typing-app'
      - '--region'
      - 'asia-northeast1'
      - '--set-env-vars'
      - 'FIREBASE_API_KEY=AIzaSyD3c_blH9dIaOjp8hfdENcl0F2s2Y4xlFs,PROJECT_ID=$PROJECT_ID,DATABASE_ID=(default)'
      - '--allow-unauthenticated'
options:
  logging: CLOUD_LOGGING_ONLY